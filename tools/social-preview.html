<!doctype html>
<!-- Source for assets/img/social-preview.png (the image LinkedIn shows when the link is shared).
     Regenerate with a 1200x630 headless browser screenshot of this page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Social preview</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #f5f2ec;
      color: #1b1e22;
      font-family: Inter, sans-serif;
      background-image:
        linear-gradient(#ece7de 1px, transparent 1px),
        linear-gradient(90deg, #ece7de 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .wrap { position: relative; height: 100%; padding: 64px 72px; box-sizing: border-box; }
    .eyebrow { font: 500 15px/1 "IBM Plex Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: #6b717a; }
    h1 { margin: 22px 0 18px; font: 400 128px/.92 "Instrument Serif", serif; letter-spacing: -.02em; }
    p { margin: 0; font-size: 30px; line-height: 1.3; max-width: 22ch; }
    em { font-family: "Instrument Serif", serif; font-size: 36px; color: #1f3a5f; }
    .skyline { position: absolute; left: 0; right: 0; bottom: 18px; padding: 0 40px; }
    .skyline img { width: 100%; display: block; }
    .badge {
      position: absolute; right: 72px; top: 64px;
      width: 132px; height: 160px; border-radius: 999px 999px 14px 14px;
      overflow: hidden; border: 1px solid #d8d1c4; background: #fff;
    }
    .badge img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Leasing &amp; Property Management · Vancouver, BC</div>
    <h1>Michael Tapia</h1>
    <p>Leasing homes across Vancouver, <em>from listing to move-in.</em></p>
    <div class="badge"><img src="../assets/img/profile/michael-tapia.jpg" alt=""></div>
  </div>
  <div class="skyline"><img src="../assets/img/illustrations/skyline.svg" alt=""></div>
</body>
</html>
